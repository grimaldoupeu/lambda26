site_name: Big Data
site_url: https://262bigdata.github.io/lambda26/
repo_url: https://github.com/262bigdata/lambda26
repo_name: 262bigdata/lambda26
docs_dir: docs

nav:
  - Inicio: index.md
  - Guía de Proyecto Sello:
      - Guía del proyecto: proyecto-sello/index.md
      - Brief técnico-analítico (plantilla): proyecto-sello/brief.md
      - Producto U1 (plantilla-ejemplo): proyecto-sello/u1-producto.md
      - Producto U2 (plantilla-ejemplo): proyecto-sello/u2-producto.md
      - Producto U3 / Producto Final (plantilla-ejemplo): proyecto-sello/u3-producto.md
      - Matriz de competencias (ICACIT): proyecto-sello/matriz-competencias.md
  - Silabos:
      - Silabo 2026-1: silabo_bigdata_2026_1.md
      - Silabo 2026-2: silabo_bigdata_2026_2.md
  - 1. Arquitecturas Big Data y ETL batch distribuido:
      - "S1 - Arquitectura Big Data: Lambda y Kappa, batch vs. streaming": sesiones/S01_Arquitectura_Big_Data_Lambda_Kappa.md
      - "S2 - Fundamentos PySpark: transformaciones, funciones, agrupaciones y evaluación perezosa": sesiones/S02_Fundamentos_PySpark_Transformaciones_Lazy_Evaluation.md
      - "S3 - Procesamiento y Calidad de Datos: filtrado, duplicados, nulos y particionamiento analítico": sesiones/S03_Procesamiento_Calidad_Datos_Particionamiento.md
      - "S4 - ML Distribuido con Spark MLlib (Regresión)": sesiones/S04_ML_Distribuido_Regresion_Spark_MLlib.md
      - "S5 - Evaluación de la Unidad I": sesiones/S05_Evaluacion_Unidad_1.md
  - 2. Sistema Big Data en tiempo real:
      - "S6 - Ingesta de Eventos Empresariales en Tiempo Real": sesiones/S06_Ingesta_Eventos_Empresariales_Kafka.md
      - "S7 - Ingesta de Eventos IoT/Sensores en Tiempo Real": sesiones/S07_Ingesta_Eventos_IoT_Sensores_Tiempo_Real.md
      - "S8 - Procesamiento en Streaming con Spark": sesiones/S08_Procesamiento_Streaming_Spark_Ventanas_Watermarking.md
      - "S12 - Evaluación de la Unidad II": sesiones/S12_Evaluacion_Unidad_2.md
  - 3. Integración, DataOps y despliegue del sistema final:
      - "S15 - Evaluación de la Unidad III": sesiones/S15_Evaluacion_Unidad_3.md

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true

plugins:
  - search
